services:
  - type: web
    name: moneymatefinanceapp-backend
    env: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        value: "moneymate_super_secret_jwt_key_2026"
      - key: NODE_ENV
        value: "production"
